<style>
  :root{
    --ink:        #0D0D0E;
    --ink-2:      #15151A;
    --line:       #26262B;
    --paper:      #F3EAD5;
    --paper-dim:  #C9BFAA;
    --mute:       #7E7B73;
    --gold:       #C9A35E;
    --gold-deep:  #9E7D3F;
    --burgundy:   #6B1A28;
    --rose:       #C44A6A;
    --indigo:     #5B7BB0;
    --sage:       #8A9270;
    --cream:      #FAF6EC;
  }
  html, body { background: var(--ink); color: var(--paper); }
  body {
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.005em;
  }
  .serif { font-family: 'Fraunces', 'Times New Roman', serif; font-optical-sizing: auto; }
  .mono  { font-family: 'IBM Plex Mono', monospace; }
  .italic-serif { font-family: 'Fraunces', serif; font-style: italic; }

  /* 페이지 페이드인 */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .reveal { animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) both; }
  .reveal-1 { animation-delay: .05s; }
  .reveal-2 { animation-delay: .15s; }
  .reveal-3 { animation-delay: .28s; }
  .reveal-4 { animation-delay: .42s; }

  /* 미묘한 그레인 */
  .grain::before {
    content:''; position: fixed; inset:0; pointer-events:none; z-index:1; opacity:.045;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* 디바이더 */
  .hr-thin { border-top: 1px solid var(--line); }
  .hr-gold { border-top: 1px solid var(--gold); }
  .hr-dot  { border-top: 1px dashed var(--line); }

  /* 입력 — 박스 없이 밑줄만 */
  .input-line {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--paper-dim);
    color: var(--paper);
    padding: 8px 0;
    outline: none;
    transition: border-color .25s;
  }
  .input-line:focus { border-bottom-color: var(--gold); }

  /* 버튼: 솔리드 골드 */
  .btn-primary {
    background: var(--gold);
    color: var(--ink);
    padding: 14px 28px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: all .3s cubic-bezier(.2,.7,.2,1);
    border: 1px solid var(--gold);
  }
  .btn-primary:hover { background: var(--paper); border-color: var(--paper); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

  /* 버튼: 아웃라인 */
  .btn-ghost {
    background: transparent;
    color: var(--paper);
    padding: 12px 24px;
    border: 1px solid var(--paper-dim);
    transition: all .25s;
    font-family: 'Fraunces', serif;
    letter-spacing: 0.02em;
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

  /* 미묘한 카드 */
  .card-editorial {
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }

  /* 스테이지 트래커 */
  .track-line {
    height: 1px;
    background: var(--line);
    position: relative;
  }
  .track-fill {
    position: absolute;
    height: 1px;
    background: var(--gold);
    transition: width .8s cubic-bezier(.2,.7,.2,1);
  }
  .track-dot {
    width: 7px; height: 7px;
    background: var(--ink);
    border: 1px solid var(--paper-dim);
    border-radius: 50%;
    position: relative;
    z-index: 1;
    transition: all .3s;
  }
  .track-dot.active { background: var(--gold); border-color: var(--gold); }
  .track-dot.done   { background: var(--paper); border-color: var(--paper); }

  /* 영상 카드 호버 */
  .index-row {
    transition: background .35s cubic-bezier(.2,.7,.2,1), padding .35s;
    border-bottom: 1px solid var(--line);
  }
  .index-row:hover { background: var(--ink-2); }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--ink); }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--mute); }

  /* 가는 underline 링크 */
  .link-underline {
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    text-decoration-color: var(--paper-dim);
    transition: text-decoration-color .25s;
  }
  .link-underline:hover { text-decoration-color: var(--gold); }

  /* drop number */
  .drop-num {
    font-family: 'Fraunces', serif;
    font-weight: 200;
    line-height: 0.85;
    color: var(--gold);
  }

  /* select hover row */
  .row-select {
    cursor: pointer;
    transition: all .35s;
  }
  .row-select:hover { padding-left: 12px; }
  .row-select:hover .row-arrow { transform: translateX(6px); color: var(--gold); }
  .row-arrow { transition: all .35s; display: inline-block; }

  /* 텍스트 사이즈 미세 조정 */
  .tracker-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); }
  .small-caps   { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; }

  /* 캔버스 프레임 */
  .frame-canvas {
    padding: 10px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    position: relative;
  }
  .frame-canvas::before, .frame-canvas::after {
    content: ''; position: absolute; width: 12px; height: 12px; border: 1px solid var(--gold);
  }
  .frame-canvas::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .frame-canvas::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  /* slim loader */
  .pulse {
    width: 8px; height: 8px; background: var(--gold); border-radius: 50%;
    animation: pulse 1.2s cubic-bezier(.2,.7,.2,1) infinite;
    display: inline-block;
  }
  @keyframes pulse {
    0%,100% { opacity: .3; transform: scale(.8); }
    50%     { opacity: 1; transform: scale(1.1); }
  }

  /* ── 가로형 비디오 카드 ── */
  .reel-card {
    background: var(--ink-2);
    border: 1px solid var(--line);
    transition: border-color .35s, transform .35s, box-shadow .35s;
    overflow: hidden;
    position: relative;
  }
  .reel-card:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(201,163,94,0.12);
  }
  .reel-cover {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }
  .reel-cover img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .reel-card:hover .reel-cover img { transform: scale(1.04); }
  .reel-play-btn {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, transparent 40%, rgba(13,13,14,0.7));
    transition: background .3s;
    cursor: pointer;
  }
  .reel-play-btn:hover { background: linear-gradient(180deg, transparent 30%, rgba(13,13,14,0.85)); }
  .reel-play-icon {
    width: 56px; height: 56px; border-radius: 50%;
    border: 1px solid var(--paper);
    background: rgba(13,13,14,0.5);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    transition: all .3s;
  }
  .reel-card:hover .reel-play-icon { background: var(--gold); border-color: var(--gold); color: var(--ink); transform: scale(1.05); }
  .reel-rank {
    position: absolute; top: 12px; left: 16px;
    font-family: 'Fraunces', serif;
    font-weight: 200; font-size: 56px; line-height: 0.8;
    color: var(--gold);
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    z-index: 2;
  }
  .reel-region {
    position: absolute; top: 16px; right: 16px;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--paper); background: rgba(13,13,14,0.7);
    padding: 4px 10px; border: 1px solid rgba(243,234,213,0.3);
    backdrop-filter: blur(6px);
    z-index: 2;
  }
  .reel-meta-bar {
    position: absolute; bottom: 12px; right: 16px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--paper); background: rgba(13,13,14,0.7);
    padding: 3px 8px; backdrop-filter: blur(6px);
    z-index: 2;
  }

  /* ── 상태 패널 ── */
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 4px 10px; border: 1px solid;
  }
  .status-ok    { color: #6FD49A; border-color: rgba(111,212,154,0.35); background: rgba(111,212,154,0.05); }
  .status-warn  { color: var(--gold); border-color: rgba(201,163,94,0.35); background: rgba(201,163,94,0.05); }
  .status-paid  { color: var(--rose); border-color: rgba(196,74,106,0.35); background: rgba(196,74,106,0.05); }
</style>

var PERSONA_ANALYST = "\uB2F9\uC2E0\uC740 \uC720\uD29C\uBE0C \uC1FC\uCE20 \uBC14\uC774\uB7F4 \uBA54\uCEE4\uB2C8\uC998 \uC804\uBB38\uAC00\uC785\uB2C8\uB2E4. \uB370\uC774\uD130 \uC0AC\uC774\uC5B8\uD2F0\uC2A4\uD2B8 + \uC601\uC0C1 \uC81C\uC791\uC790 + \uD589\uB3D9\uC2EC\uB9AC\uD559\uC790\uC758 \uD558\uC774\uBE0C\uB9AC\uB4DC. \uC601\uC0C1 \uD55C \uD3B8\uC774 #1\uC774 \uB418\uB294 \uBCF8\uC9C8\uC801 \uAD6C\uC870\uB97C \uBC1C\uB77C\uB0B4\uB294 \uC0AC\uB78C.\n\n\uC8FC\uC5B4\uC9C4 \uC815\uBCF4: \uC601\uC0C1 \uC81C\uBAA9, \uC124\uBA85, \uD574\uC2DC\uD0DC\uADF8, \uAE38\uC774, \uC870\uD68C\uC218, \uC9C0\uC5ED. \uC601\uC0C1 \uB0B4\uC6A9\uC740 \uBCF4\uC9C0 \uBABB\uD588\uC73C\uB2C8 \uBA54\uD0C0\uB370\uC774\uD130\xB7\uBB38\uD654 \uCEE8\uD14D\uC2A4\uD2B8\xB7\uC81C\uBAA9 \uD328\uD134\uC73C\uB85C \uCD94\uB860\uD558\uC5EC \uCC44\uC6B0\uC138\uC694. \uB2E8, \uCD94\uB860\uD55C \uBD80\uBD84\uC740 \uC790\uC2E0\uAC10 \uC788\uAC8C, \uADF8\uB7EC\uB098 \uC815\uD655\uD558\uAC8C.\n\n\uB2F9\uC2E0\uC758 \uC784\uBB34: \uC774 \uC601\uC0C1\uC774 \uC65C \uBC14\uC774\uB7F4\uB410\uB294\uC9C0 \uAE4A\uC774 \uBD84\uC11D\uD558\uACE0, \uADF8 \uAD6C\uC870\uB97C \uB2E4\uB978 \uAD11\uACE0\uC5D0 \uBCF5\uC81C \uAC00\uB2A5\uD55C \uD615\uD0DC\uB85C JSON \uCD94\uCD9C.\n\n\uBC18\uB4DC\uC2DC JSON\uC73C\uB85C\uB9CC \uC751\uB2F5:\n{\n  \"rank1Reason\": \"\uC774 \uC601\uC0C1\uC774 #1\uC774 \uB41C \uD575\uC2EC \uC774\uC720 \uD55C \uBB38\uC7A5\",\n  \"hookType\": \"shock_reveal | curiosity_gap | identification | challenge | tutorial | drama | nostalgia | fomo\",\n  \"hookMechanic\": \"0\u20133\uCD08\uC5D0 \uC77C\uC5B4\uB098\uB294 \uD328\uD134 \uC778\uD130\uB7FD\uD2B8 (\uC2A4\uD06C\uB864\uC744 \uBA48\uCD94\uAC8C \uD558\uB294 \uBA54\uCEE4\uB2C8\uC998)\",\n  \"viralFactors\": [\"\uBC14\uC774\uB7F4 \uC694\uC18C 1\", \"\uC694\uC18C 2\", \"\uC694\uC18C 3\"],\n  \"emotionalArc\": [\n    {\"t\": 0, \"emotion\": \"curiosity\", \"intent\": \"\uD655\uC778\uD558\uACE0 \uC2F6\uAC8C \uB9CC\uB4E4\uAE30\"},\n    {\"t\": \"\uC911\uBC18\", \"emotion\": \"surprise\", \"intent\": \"\uC608\uC0C1 \uAE68\uAE30\"},\n    {\"t\": \"\uB05D\", \"emotion\": \"satisfaction\", \"intent\": \"\uB313\uAE00\xB7\uACF5\uC720 \uC720\uB3C4\"}\n  ],\n  \"visualPacing\": {\n    \"cutFrequency\": \"fast | medium | slow\",\n    \"avgShotLength\": \"1-3s | 3-7s | 7s+\",\n    \"cameraStyle\": \"selfie POV | static observer | dynamic handheld | mixed\"\n  },\n  \"culturalCues\": [\"\uBB38\uD654 \uCF54\uB4DC 1\", \"\uCF54\uB4DC 2\"],\n  \"replicableStructure\": \"\uBCF5\uC81C \uAC00\uB2A5\uD55C \uAD6C\uC870 \u2014 \uC0C8 \uC601\uC0C1\uC5D0\uC11C \uC774\uB807\uAC8C \uB530\uB77C\uD558\uBA74 \uBE44\uC2B7\uD55C \uD6A8\uACFC\",\n  \"thaiAdaptationNotes\": \"\uD0DC\uAD6D \uBCD1\uB9DB \uBBF8\uD559\uC73C\uB85C \uBCC0\uD658 \uC2DC \uAC15\uC870\uD574\uC57C \uD560 \uD3EC\uC778\uD2B8 2~3\uAC1C\"\n}";
